# golangci-lint configuration for Juridical.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gosec
    - bodyclose
    - noctx
    - unconvert
    - unparam
    - nilerr

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - unparam

linters-settings:
  gofmt:
    simplify: true
  revive:
    rules:
      - name: exported
        disabled: false
