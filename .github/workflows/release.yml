name: release

# Tag-triggered release: reproducible static binaries + SBOM + keyless cosign
# signatures via GoReleaser, then SLSA build provenance via the SLSA generator
# reusable workflow.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  goreleaser:
    name: goreleaser (build, sbom, sign)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      packages: write # push images if configured
      id-token: write # cosign keyless (OIDC)
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute artifact hashes for SLSA
        id: hash
        run: |
          set -euo pipefail
          # GoReleaser writes a sha256 checksum file over all release artifacts.
          hashes=$(base64 -w0 < dist/checksums.txt)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

  provenance:
    name: slsa provenance
    needs: [goreleaser]
    permissions:
      actions: read # read the workflow run for provenance
      id-token: write # sign the provenance (OIDC)
      contents: write # attach provenance to the release
    # SLSA generator is a reusable workflow and MUST be referenced by an
    # immutable release tag (not a branch or arbitrary SHA), per SLSA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
