name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "25 3 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload SARIF to code scanning
        # TEMPORARY (ratified decision): private repo without GitHub Advanced
        # Security -- the code-scanning SARIF upload fails on push-to-main for the
        # same GHAS reason as codeql.yml. continue-on-error keeps that expected
        # failure from going red while still logging it.
        # REMOVE this line when the repo goes public / GHAS is enabled.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
