name: sanitization

# Fast (seconds), fail-loud gate that cannot silently pass: commit identity
# (author/committer must be a GitHub noreply email), internal-disclosure
# scan of tracked files (homelab hostnames / addresses must never leak into
# a public-bound repo), and a secret scan (gitleaks) that fails the build if
# the tool is missing, errors, or doesn't actually run -- never a false
# green because the scanner was silently absent.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  sanitization:
    name: sanitization
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Commit identity (author + committer must be GitHub noreply email)
        run: |
          set -euo pipefail
          pattern='^noreply@github\.com$|@users\.noreply\.github\.com$'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            single=""
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              # First push / branch create: no prior sha to diff against,
              # so only check HEAD.
              range=""
              single="${{ github.sha }}"
            else
              range="${before}..${{ github.sha }}"
              single=""
            fi
          fi

          bad=0
          check_one() {
            h="$1"; ae="$2"; ce="$3"
            short="$(git rev-parse --short "$h")"
            if ! printf '%s' "$ae" | grep -qiE "$pattern"; then
              echo "::error::commit ${short}: author email '${ae}' is not an accepted GitHub noreply address -- must be *@users.noreply.github.com or exactly noreply@github.com" >&2
              bad=1
            fi
            if ! printf '%s' "$ce" | grep -qiE "$pattern"; then
              echo "::error::commit ${short}: committer email '${ce}' is not an accepted GitHub noreply address -- must be *@users.noreply.github.com or exactly noreply@github.com" >&2
              bad=1
            fi
          }

          if [ -n "$single" ]; then
            while read -r h ae ce; do
              [ -z "$h" ] && continue
              check_one "$h" "$ae" "$ce"
            done < <(git log -1 --format='%H %ae %ce' "$single")
          else
            while read -r h ae ce; do
              [ -z "$h" ] && continue
              check_one "$h" "$ae" "$ce"
            done < <(git rev-list "$range" --format='%H %ae %ce' | grep -v '^commit ')
          fi

          [ "$bad" -eq 0 ] || { echo "::error::commit-identity check FAILED -- see offending commit(s)/field(s)/email(s) above" >&2; exit 1; }
          echo "commit-identity: OK (all commits in range use @users.noreply.github.com or noreply@github.com for both author and committer)"

      - name: Internal disclosure scan (homelab domain / 192.168.1.x subnet)
        run: |
          set -euo pipefail
          allowlist=".sanitization-allowlist"

          # Guard: an allowlist entry that matches everything would silently
          # disable this entire check. Reject bare wildcards/roots outright,
          # and generically reject any pattern that matches two unrelated,
          # dissimilar synthetic paths (i.e. is effectively unconditional).
          validate_allowlist() {
            [ -f "$allowlist" ] || return 0
            while IFS= read -r raw; do
              pat="${raw%%#*}"
              pat="$(printf '%s' "$pat" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "$pat" ] && continue
              case "$pat" in
                '*'|'**'|'.'|'./'|'/')
                  echo "::error:: allowlist entry '${pat}' is too broad — it would disable the disclosure scan" >&2
                  exit 1
                  ;;
              esac
              c1=".sanitization-canary-$$-alpha"
              c2="some/deeply/nested/canary-$$-beta.bin"
              m1=0; m2=0
              case "$c1" in $pat) m1=1 ;; esac
              case "$c2" in $pat) m2=1 ;; esac
              if [ "$m1" -eq 1 ] && [ "$m2" -eq 1 ]; then
                echo "::error:: allowlist entry '${pat}' is too broad — it would disable the disclosure scan" >&2
                exit 1
              fi
            done < "$allowlist"
          }

          validate_allowlist

          is_allowlisted() {
            f="$1"
            [ -f "$allowlist" ] || return 1
            while IFS= read -r raw; do
              pat="${raw%%#*}"
              # trim leading/trailing whitespace
              pat="$(printf '%s' "$pat" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "$pat" ] && continue
              case "$f" in
                $pat) return 0 ;;
              esac
            done < "$allowlist"
            return 1
          }

          fail=0

          scan_pattern() {
            regex="$1"; label="$2"
            while IFS= read -r f; do
              case "$f" in
                .github/workflows/sanitization.yml|.sanitization-allowlist) continue ;;
              esac
              [ -f "$f" ] || continue
              is_allowlisted "$f" && continue
              # -a: force binary-classified files to be scanned as text (an
              #     internal identifier embedded as plaintext in a binary
              #     file must not silently escape detection); -o: only the
              #     matched text (keeps NUL/binary noise out of downstream
              #     parsing); -n: line numbers; -i: case-insensitive; -E:
              #     extended regex.
              while IFS=: read -r lineno match; do
                [ -z "$lineno" ] && continue
                echo "::error::${f}:${lineno}: internal identifier '${match}' (${label}) must not appear in a public-bound repo; add to .sanitization-allowlist if legitimate" >&2
                fail=1
              done < <(grep -naoiE "$regex" "$f" 2>/dev/null || true)
            done < <(git ls-files)
          }

          # Internal domain needle assembled from fragments at runtime so the
          # cleartext literal is never committed to this public-bound repo.
          dom_re="$(printf 'cmViaGFobm9taWNvbg==' | base64 -d)\.com"
          scan_pattern "$dom_re" 'internal homelab domain'
          scan_pattern '192\.168\.1\.[0-9]{1,3}' '192.168.1.x homelab subnet address'

          [ "$fail" -eq 0 ] || { echo "::error::internal-disclosure scan FAILED -- see file(s)/line(s)/pattern(s) above" >&2; exit 1; }
          echo "internal-disclosure: OK"

      - name: Secret scan (gitleaks; must fail loud, never false-green)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, taken from the
          # official checksums.txt asset on the v8.30.1 GitHub release
          # (github.com/gitleaks/gitleaks/releases/tag/v8.30.1) and
          # cross-verified against the downloaded tarball's own digest.
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

          if ! command -v gitleaks >/dev/null 2>&1; then
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
            echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c - || { echo "::error::gitleaks tarball sha256 mismatch -- refusing to extract/run an unverified binary, failing loudly" >&2; exit 1; }
            tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
            sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          fi

          command -v gitleaks >/dev/null 2>&1 || { echo "::error::gitleaks not installed -- failing loudly, this check must never pass because the tool was absent" >&2; exit 1; }

          set +e
          gitleaks detect --no-banner --redact --exit-code 1 --source .
          rc=$?
          set -e

          case "$rc" in
            0) echo "gitleaks: 0 leaks found -- PASS" ;;
            1) echo "::error::gitleaks found leak(s) in the repository -- see findings above, failing the build" >&2; exit 1 ;;
            *) echo "::error::gitleaks exited with unexpected code ${rc} -- the scan did not complete cleanly, failing loudly (a tool error is never treated as a pass)" >&2; exit 1 ;;
          esac
