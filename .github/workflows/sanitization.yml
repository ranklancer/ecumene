name: sanitization

# Fail-loud gate that cannot silently pass: commit identity (author/committer
# must be a GitHub noreply email), internal-disclosure scan of tracked files
# (homelab identifiers must never leak into a public-bound repo), and a secret
# scan (gitleaks) that fails the build if the tool is missing, errors, or does
# not actually run -- never a false green because the scanner was absent.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  sanitization:
    name: sanitization
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Commit identity (author + committer must be GitHub noreply email)
        run: |
          set -euo pipefail
          pattern='^noreply@github\.com$|@users\.noreply\.github\.com$'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            single=""
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range=""; single="${{ github.sha }}"
            else
              range="${before}..${{ github.sha }}"; single=""
            fi
          fi
          bad=0
          check_one() {
            h="$1"; ae="$2"; ce="$3"
            short="$(git rev-parse --short "$h")"
            printf '%s' "$ae" | grep -qiE "$pattern" || { echo "::error::commit ${short}: author email '${ae}' is not a GitHub noreply address" >&2; bad=1; }
            printf '%s' "$ce" | grep -qiE "$pattern" || { echo "::error::commit ${short}: committer email '${ce}' is not a GitHub noreply address" >&2; bad=1; }
          }
          if [ -n "$single" ]; then
            while read -r h ae ce; do [ -z "$h" ] && continue; check_one "$h" "$ae" "$ce"; done < <(git log -1 --format='%H %ae %ce' "$single")
          else
            while read -r h ae ce; do [ -z "$h" ] && continue; check_one "$h" "$ae" "$ce"; done < <(git rev-list "$range" --format='%H %ae %ce' | grep -v '^commit ')
          fi
          [ "$bad" -eq 0 ] || { echo "::error::commit-identity check FAILED" >&2; exit 1; }
          echo "commit-identity: OK"

      - name: Internal disclosure scan (homelab domain / 192.168.1.x subnet)
        run: |
          set -euo pipefail
          allowlist=".sanitization-allowlist"

          # Guard: an allowlist entry matching everything would silently disable
          # this check. Reject bare wildcards and any pattern that matches two
          # unrelated synthetic paths (i.e. is effectively unconditional).
          validate_allowlist() {
            [ -f "$allowlist" ] || return 0
            while IFS= read -r raw; do
              pat="${raw%%#*}"; pat="$(printf '%s' "$pat" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "$pat" ] && continue
              case "$pat" in
                '*'|'**'|'.'|'./'|'/') echo "::error:: allowlist entry '${pat}' is too broad" >&2; exit 1 ;;
              esac
              c1=".sanitization-canary-$$-alpha"; c2="some/deeply/nested/canary-$$-beta.bin"
              m1=0; m2=0
              case "$c1" in $pat) m1=1 ;; esac
              case "$c2" in $pat) m2=1 ;; esac
              if [ "$m1" -eq 1 ] && [ "$m2" -eq 1 ]; then echo "::error:: allowlist entry '${pat}' is too broad" >&2; exit 1; fi
            done < "$allowlist"
          }
          validate_allowlist

          is_allowlisted() {
            f="$1"; [ -f "$allowlist" ] || return 1
            while IFS= read -r raw; do
              pat="${raw%%#*}"; pat="$(printf '%s' "$pat" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "$pat" ] && continue
              case "$f" in $pat) return 0 ;; esac
            done < "$allowlist"
            return 1
          }

          # Internal domain needle assembled from fragments at runtime so the
          # cleartext literal never appears in this public repo. Still runs on
          # every push and fork PR, still fails closed.
          dom_re="$(printf 'cmViaGFobm9taWNvbg==' | base64 -d)\.com"
          sub_re='192\.168\.1\.[0-9]{1,3}'

          fail=0
          scan_pattern() {
            regex="$1"; label="$2"
            while IFS= read -r f; do
              case "$f" in .github/workflows/sanitization.yml|.sanitization-allowlist) continue ;; esac
              [ -f "$f" ] || continue
              is_allowlisted "$f" && continue
              while IFS=: read -r lineno match; do
                [ -z "$lineno" ] && continue
                echo "::error::${f}:${lineno}: internal identifier (${label}) must not appear in a public-bound repo; add to .sanitization-allowlist if legitimate" >&2
                fail=1
              done < <(grep -naoiE "$regex" "$f" 2>/dev/null || true)
            done < <(git ls-files)
          }
          scan_pattern "$dom_re" 'internal homelab domain'
          scan_pattern "$sub_re" 'homelab /24 subnet address'

          [ "$fail" -eq 0 ] || { echo "::error::internal-disclosure scan FAILED" >&2; exit 1; }
          echo "internal-disclosure: OK (no internal homelab domain / 192.168.1.x in tracked files)"

      - name: Secret scan (gitleaks; fail loud, rootless install)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          if ! command -v gitleaks >/dev/null 2>&1; then
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
            echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c - || { echo "::error::gitleaks tarball sha256 mismatch" >&2; exit 1; }
            tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
            mkdir -p "$HOME/.local/bin"; install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.local/bin:$PATH"
          fi
          command -v gitleaks >/dev/null 2>&1 || { echo "::error::gitleaks not installed" >&2; exit 1; }
          set +e; gitleaks detect --no-banner --redact --exit-code 1 --source .; rc=$?; set -e
          case "$rc" in
            0) echo "gitleaks: 0 leaks found -- PASS" ;;
            1) echo "::error::gitleaks found leak(s)" >&2; exit 1 ;;
            *) echo "::error::gitleaks exited ${rc} -- scan did not complete cleanly" >&2; exit 1 ;;
          esac
