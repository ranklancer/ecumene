name: codeql

on:
  push:
    branches: [main]
  schedule:
    - cron: "25 4 * * 1"

permissions: {}

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      - name: Analyze
        # TEMPORARY (ratified decision): this repo is private without GitHub Advanced
        # Security, so the code-scanning upload in this step fails with "Advanced
        # Security must be enabled..." on every run. continue-on-error keeps that
        # expected failure from blocking PRs while still surfacing it in the logs.
        # REMOVE this line when the repo goes public / GHAS is enabled.
        continue-on-error: true
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
