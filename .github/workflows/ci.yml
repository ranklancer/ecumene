name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  gate:
    name: gate-full
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: true
      - name: Install gate tools (pinned)
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.3
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: make gate-full
        run: make gate-full

  commit-identity:
    name: commit-identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit authored + committed as PRODUCT_COMMIT_EMAIL
        env:
          EXPECTED: ${{ vars.PRODUCT_COMMIT_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED:-}" ]; then
            echo "commit-identity: PRODUCT_COMMIT_EMAIL repo variable is not set - failing closed" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          bad=0
          while read -r ae ce h; do
            if [ "$ae" != "$EXPECTED" ] || [ "$ce" != "$EXPECTED" ]; then
              echo "commit $h: author=$ae committer=$ce (expected $EXPECTED)" >&2
              bad=1
            fi
          done < <(git log --format='%ae %ce %h' "$range" 2>/dev/null || git log -1 --format='%ae %ce %h')
          [ "$bad" -eq 0 ] || { echo "commit-identity: FAILED" >&2; exit 1; }
          echo "commit-identity: OK"
