name: expanded

# Deeper, slower checks kept out of the fast PR gate: dependency vulnerability
# scanning (required at 0.1) and fuzzing of untrusted-input parsers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "25 5 * * 1"

permissions: {}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
      - name: govulncheck
        # Vulnerability scanning is required at 0.1 -- we do NOT blanket-disable
        # it. This step still fails the build on any finding whose vulnerable
        # module is first-party code or a third-party dependency. It only
        # tolerates findings whose vulnerable module is "stdlib" (i.e. rooted in
        # the pinned GOTOOLCHAIN=local go1.22.12 toolchain), which are printed
        # loudly below as a known-accepted set. Remediation for those is a Go
        # toolchain upgrade -- a maintainer decision, tracked separately. It
        # also fails loudly (never silently passes) if govulncheck is missing,
        # errors, or produces unparseable/empty output.
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

          OUT="${RUNNER_TEMP:-.}/govulncheck.json"
          GV_STDERR="${RUNNER_TEMP:-.}/govulncheck.stderr"
          set +e
          govulncheck -format json ./... > "$OUT" 2> "$GV_STDERR"
          GV_EXIT=$?
          set -e

          # BLOCKER FIX: a non-zero exit from `govulncheck -format json` means the
          # scan did NOT complete (compile/build error, unresolved or renamed
          # dependency, vendor inconsistency, module-download flake, etc) -- it is
          # NEVER a signal that vulnerabilities were found. govulncheck emits its
          # `config` JSON object BEFORE package loading, so a run that dies during
          # package loading can still produce valid JSON containing the `config`
          # marker with ZERO findings, which would otherwise sail through every
          # guard below and print "0 non-stdlib findings -- PASS". Verified
          # empirically that `govulncheck -format json` exits 0 even with findings
          # present (126 findings, exit 0), so a non-zero exit unambiguously means
          # tool/scan error, never "vulnerabilities found" -- this check cannot
          # create a false-red. Fail loudly here, before any JSON parsing. Do NOT
          # remove this check.
          if [ "$GV_EXIT" -ne 0 ]; then
            echo "::error::govulncheck exited $GV_EXIT -- scan did not complete, failing loudly (no vulnerability assessment was performed)" >&2
            cat "$GV_STDERR" >&2 || true
            exit 1
          fi

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is not available on this runner -- cannot gate govulncheck results, failing loudly" >&2
            exit 1
          fi

          if [ ! -s "$OUT" ]; then
            echo "::error::govulncheck produced no/empty output (tool exit $GV_EXIT) -- failing loudly rather than passing silently" >&2
            cat "$GV_STDERR" >&2 || true
            exit 1
          fi

          if ! jq empty "$OUT" >/dev/null 2>&1; then
            echo "::error::govulncheck output is not valid JSON (tool exit $GV_EXIT) -- failing loudly" >&2
            echo "--- raw output ---" >&2
            cat "$OUT" >&2
            echo "--- stderr ---" >&2
            cat "$GV_STDERR" >&2 || true
            exit 1
          fi

          # NOTE: govulncheck's JSON output is a stream of concatenated top-level
          # objects, not one JSON array. jq's `-e` bases its exit status on the
          # LAST top-level input's result, so a bare `select()` here is unreliable
          # across a multi-document stream -- always slurp (`-s`) into one array
          # first so `-e` evaluates a single boolean value.
          if ! jq -s -e 'any(.[]; .config != null)' "$OUT" >/dev/null 2>&1; then
            echo "::error::govulncheck JSON has no 'config' marker -- output looks incomplete/unexpected, failing loudly" >&2
            cat "$OUT" >&2
            exit 1
          fi

          NONSTDLIB_COUNT=$(jq -s '[.[] | select(.finding != null) | select(.finding.trace[0].module != "stdlib")] | length' "$OUT")
          STDLIB_COUNT=$(jq -s '[.[] | select(.finding != null) | select(.finding.trace[0].module == "stdlib")] | length' "$OUT")
          STDLIB_OSV_COUNT=$(jq -s -r '[.[] | select(.finding != null) | select(.finding.trace[0].module == "stdlib") | .finding.osv] | unique | length' "$OUT")

          if [ "$NONSTDLIB_COUNT" -gt 0 ]; then
            echo "::error::govulncheck found $NONSTDLIB_COUNT non-stdlib vulnerability finding(s) -- these are first-party or third-party module vulns and THIS FAILS THE BUILD" >&2
            jq -s -r '.[] | select(.finding != null) | select(.finding.trace[0].module != "stdlib") | "  MODULE=" + .finding.trace[0].module + " OSV=" + .finding.osv + " SYMBOL=" + (.finding.trace[0].package // "?") + "." + (.finding.trace[0].function // "?")' "$OUT" >&2
            exit 1
          fi

          echo "govulncheck: 0 non-stdlib findings -- PASS (build-blocking category clean)"
          echo "govulncheck: $STDLIB_COUNT stdlib/toolchain finding(s) across $STDLIB_OSV_COUNT distinct OSV id(s) -- KNOWN-ACCEPTED, not build-blocking"

          # Drift detection: previously a NEW stdlib CVE would only show up as a
          # changed number inside the folded ::group:: below, on an otherwise-green
          # check -- nobody would notice. STDLIB_OSV_BASELINE is the last-reviewed
          # count of distinct stdlib OSV ids (verified 45 as of this commit). If the
          # live count exceeds it, a new stdlib vuln has landed since the baseline
          # was set: fail loudly, name the OSV id(s)/symbol(s) so a maintainer can
          # review them, then bump STDLIB_OSV_BASELINE once reviewed.
          STDLIB_OSV_BASELINE=45
          if [ "$STDLIB_OSV_COUNT" -gt "$STDLIB_OSV_BASELINE" ]; then
            echo "::error::stdlib OSV drift detected: $STDLIB_OSV_COUNT distinct stdlib OSV id(s) found, expected baseline of $STDLIB_OSV_BASELINE -- a new stdlib CVE has landed and must be reviewed before the baseline is bumped" >&2
            jq -s -r '[.[] | select(.finding != null) | select(.finding.trace[0].module == "stdlib") | .finding.osv] | unique | .[]' "$OUT" | while read -r osv; do
              SYMS=$(jq -s -r --arg osv "$osv" '[.[] | select(.finding != null) | select(.finding.osv == $osv) | select(.finding.trace[0].module == "stdlib") | (.finding.trace[0].package // "?") + "." + (.finding.trace[0].function // "?")] | unique | join(", ")' "$OUT")
              echo "  OSV=$osv SYMBOL(S)=$SYMS" >&2
            done
            echo "::error::review the OSV id(s) above -- identify which is new versus the previously-reviewed baseline of $STDLIB_OSV_BASELINE, then bump STDLIB_OSV_BASELINE in this workflow" >&2
            exit 1
          elif [ "$STDLIB_OSV_COUNT" -lt "$STDLIB_OSV_BASELINE" ]; then
            echo "notice: stdlib OSV count ($STDLIB_OSV_COUNT) is below the baseline ($STDLIB_OSV_BASELINE) -- the baseline can be lowered"
          fi

          echo "::group::Known-accepted stdlib/toolchain findings (root cause: GOTOOLCHAIN=local go1.22.12 pin; remediation = Go upgrade, tracked separately as a maintainer decision)"
          jq -s -r '[.[] | select(.finding != null) | select(.finding.trace[0].module == "stdlib") | .finding.osv] | unique | .[]' "$OUT" | while read -r osv; do
            SYMS=$(jq -s -r --arg osv "$osv" '[.[] | select(.finding != null) | select(.finding.osv == $osv) | select(.finding.trace[0].module == "stdlib") | (.finding.trace[0].package // "?") + "." + (.finding.trace[0].function // "?")] | unique | join(", ")' "$OUT")
            echo "  OSV=$osv SYMBOL(S)=$SYMS"
          done
          echo "::endgroup::"

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
      - name: Fuzz untrusted-input parsers (as they land)
        run: make fuzz
